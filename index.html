<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Ball - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white;padding-bottom:80px}
.header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:20px}
.header b span{color:#22c55e}
.search{width:100%;margin:12px 16px;width:calc(100% - 32px);padding:10px;border-radius:10px;border:none;background:#1e293b;color:white}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;white-space:nowrap}
.tabs button{padding:8px 14px;border-radius:20px;border:none;background:#1e293b;color:#94a3b8;cursor:pointer}
.tabs button.active{background:#22c55e;color:white}
.card{background:#1e293b;margin:0 16px 16px;border-radius:14px;padding:14px}
.card h3{margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#94a3b8;text-align:left;padding:6px 4px}
td{padding:8px 4px;border-top:1px solid #334155}
.top-toggle{display:flex;background:#0f172a;border-radius:10px;padding:4px;margin-bottom:10px}
.top-toggle button{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#94a3b8;cursor:pointer}
.top-toggle button.active{background:#22c55e;color:white}
.player{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #334155}
.num{width:22px;text-align:center;color:#94a3b8}
.avatar{width:36px;height:36px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #334155}
.bottom div{text-align:center;font-size:12px;color:#94a3b8}
.bottom div.active{color:#22c55e}
</style>
</head>
<body>

<div class="header"><b>Stream<span>Ball</span></b><span>🔔 👤</span></div>
<input class="search" placeholder="Search teams, players...">

<div class="tabs" id="leagueTabs"></div>

<div class="card">
<h3>Standings</h3>
<table>
<thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead>
<tbody id="standBody"></tbody>
</table>
</div>

<div class="card">
<h3>Top Scorers</h3>
<div class="top-toggle">
<button id="btnScorers" class="active" onclick="setTop('scorers')">Scorers</button>
<button id="btnAssists" onclick="setTop('assists')">Assists</button>
</div>
<div id="topBody"></div>
</div>

<div class="bottom">
<div class="active">🏠<br>Home</div><div>📅<br>Fixtures</div><div>🔴<br>Live</div><div>▶️<br>Watch</div><div>👤<br>Profile</div>
</div>

<script>
var curTopLeague = "Premier League";
var curTop = "scorers";

// STANDINGS - Premier League example
var standings = {
"Premier League":[
["Arsenal",11,8,2,1,26],["Man City",11,7,2,2,23],["Chelsea",11,6,2,3,20],
["Tottenham",11,5,3,3,18],["Liverpool",11,5,3,3,18],["Man United",11,2,2,7,8]
],
"LaLiga":[["Real Madrid",11,9,1,1,28],["Barcelona",11,8,2,1,26]],
"Serie A":[["Lazio",11,8,2,1,26],["Roma",11,7,2,2,23]],
"Bundesliga":[["Bayern",11,10,1,0,31],["Leipzig",11,7,2,2,23]],
"Ligue 1":[["Lens",11,8,1,2,25],["Paris FC",11,7,3,1,24]]
};

// TOP SCORERS AND ASSISTS - SEPARATE LISTS! THIS IS THE FIX!
var fallback = {
"Premier League":{
scorers:[["Erling Haaland","Man City",9],["Alexander Isak","Liverpool",7],["Mohamed Salah","Liverpool",6]],
assists:[["Bukayo Saka","Arsenal",7],["Mohamed Salah","Liverpool",6],["Bruno Fernandes","Man United",5]]
},
"LaLiga":{
scorers:[["Kylian Mbappe","Real Madrid",12],["Robert Lewandowski","Barcelona",9]],
assists:[["Lamine Yamal","Barcelona",7],["Pedri","Barcelona",5]]
},
"Serie A":{
scorers:[["Gustavo Varela","Monza",9],["Donyell Malen","Roma",8]],
assists:[["Mattia Zaccagni","Lazio",5],["Juan Miranda","Bologna",5]]
},
"Bundesliga":{
scorers:[["Harry Kane","Bayern",10],["Michael Olise","Bayern",6]],
assists:[["Michael Olise","Bayern",4],["Florian Wirtz","Bayern",4]]
},
"Ligue 1":{
scorers:[["Lassine Sinayoko","Paris FC",9],["Amine Gouiri","Marseille",7]],
assists:[["Florian Thauvin","Lens",7],["Cristian Casseress Jr","Toulouse",6]]
}
};

function renderLeagues(){
var leagues = Object.keys(fallback);
document.getElementById("leagueTabs").innerHTML = leagues.map(function(l){
return '<button class="'+(l===curTopLeague?'active':'')+'" onclick="setLeague(\''+l+'\')">'+l+'</button>';
}).join("");
}
function setLeague(l){
curTopLeague = l;
renderLeagues();
renderStandings();
showTop();
}
function setTop(type){
curTop = type;
document.getElementById("btnScorers").className = type==="scorers" ? "active" : "";
document.getElementById("btnAssists").className = type==="assists" ? "active" : "";
showTop();
}
function renderStandings(){
var rows = standings[curTopLeague] || [];
document.getElementById("standBody").innerHTML = rows.map(function(r,i){
return "<tr><td>"+(i+1)+"</td><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td><td>"+r[3]+"</td><td>"+r[4]+"</td><td><b>"+r[5]+"</b></td></tr>";
}).join("");
}
function showTop(){
var rows = (fallback[curTopLeague] && fallback[curTopLeague][curTop]) || [];
document.getElementById("topBody").innerHTML = rows.map(function(p,i){
return '<div class="player"><div class="num">'+(i+1)+'</div><div class="avatar">'+p[0][0]+'</div><div style="flex:1"><b>'+p[0]+'</b><br><small style="color:#94a3b8">'+p[1]+'</small></div><b>'+p[2]+'</b></div>';
}).join("");
}
renderLeagues();
renderStandings();
showTop();
</script>
</body>
</html>>
