<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Ball - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white;padding-bottom:90px}
.header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:20px}.header b span{color:#22c55e}
.search{margin:12px 16px;width:calc(100% - 32px);padding:11px;border-radius:10px;border:none;background:#1e293b;color:white;outline:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;white-space:nowrap;scrollbar-width:none}
.tabs button{padding:8px 14px;border-radius:20px;border:none;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.tabs button.active{background:#22c55e;color:white;font-weight:bold}
.card{background:#1e293b;margin:0 16px 16px;border-radius:14px;padding:14px}
.card h3{margin-bottom:10px;color:#facc15;font-size:19px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#94a3b8;text-align:left;padding:6px 4px;font-weight:normal}
td{padding:9px 4px;border-top:1px solid #334155}
td:last-child{color:#22c55e;font-weight:bold;text-align:right}
.updated{background:#fef9c3;color:#14532d;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px}
.updated2{text-align:center;color:#94a3b8;font-size:12px;margin:8px 0 14px}
.top-toggle{display:flex;background:#0f172a;border-radius:12px;padding:4px;margin-bottom:12px;gap:4px}
.top-toggle button{flex:1;padding:10px;border:none;border-radius:9px;background:transparent;color:white;cursor:pointer;font-size:15px}
.top-toggle button.active{background:#22c55e;color:white;font-weight:bold}
.league-pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;white-space:nowrap}
.league-pills button{padding:8px 14px;border-radius:20px;border:none;background:#334155;color:white;cursor:pointer;white-space:nowrap}
.league-pills button.active{background:#22c55e;color:black;font-weight:bold}
.player{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #334155}
.num{width:20px;color:#94a3b8}
.avatar{width:36px;height:36px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #334155}
.bottom div{text-align:center;font-size:12px;color:#94a3b8}
.bottom div.active{color:#22c55e}
</style>
</head>
<body>

<div class="header"><b>Stream<span>Ball</span></b><span>🔔 👤</span></div>
<input class="search" placeholder="Search teams, players...">

<div class="tabs" id="leagueTabs"></div>

<div class="card">
<h3>Standings</h3>
<table>
<thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead>
<tbody id="standBody"></tbody>
</table>
<div class="updated2">✅ Updated 20 Nov 2026 • Auto-Fetch tries in background • If offline, shows last saved table</div>
</div>

<div class="card">
<h3>⚽ Top Scorers</h3>
<div class="updated">✅ Updated 20 Nov 2026</div>
<div class="top-toggle">
<button id="btnScorers" class="active" onclick="setTop('scorers')">⚽ Scorers</button>
<button id="btnAssists" onclick="setTop('assists')">🎯 Assists</button>
</div>
<div class="league-pills" id="topLeaguePills"></div>
<table>
<thead><tr><th>#</th><th>Player</th><th>Team</th><th id="topColHead" style="text-align:right">Goals</th></tr></thead>
<tbody id="topBody"></tbody>
</table>
</div>

<div class="bottom">
<div class="active">🏠<br>Home</div><div>📅<br>Fixtures</div><div>🔴<br>Live</div><div>▶️<br>Watch</div><div>👤<br>Profile</div>
</div>

<script>
var curLeague = "Premier League";
var curTopLeague = "Premier League";
var curTop = "scorers";

var standings = {
"Premier League":[
["Arsenal",10,8,2,0,14,26],["Man City",10,7,2,1,10,23],["Chelsea",10,6,2,2,5,20],
["Liverpool",10,6,2,2,6,20],["Tottenham",10,5,3,2,4,18],["Brighton",10,5,2,3,3,17],
["Everton",10,4,3,3,1,15],["Bournemouth",10,4,2,4,0,14],["Brentford",10,4,1,5,-2,13],
["Aston Villa",10,3,4,3,-3,13],["Tottenham",10,3,3,4,-1,12],["Newcastle",10,3,3,4,-3,12],
["Hull City",10,3,2,5,0,11],["Ipswich",10,3,2,5,-5,11],["Fulham",10,2,4,4,-4,10],
["Nottm Forest",10,2,3,5,-4,9],["Coventry",10,2,3,5,-9,9],["Man United",10,1,5,4,-5,8],
["Sunderland",10,2,2,6,-9,8],["Crystal Palace",10,2,1,7,-14,7]
],
"LaLiga":[["Real Madrid",11,9,1,1,15,28],["Barcelona",11,8,2,1,14,26],["Villarreal",11,7,2,2,8,23]],
"Serie A":[["Lazio",11,8,2,1,10,26],["Roma",11,7,2,2,7,23]],
"Bundesliga":[["Bayern",11,10,1,0,25,31],["Leipzig",11,7,2,2,10,23]],
"Ligue 1":[["Lens",11,8,1,2,10,25],["Paris FC",11,7,3,1,8,24]]
};

// *** FIXED: SCORERS AND ASSISTS ARE DIFFERENT! ***
var fallback = {
"Premier League":{
scorers:[["Erling Haaland","Man City",9],["Alexander Isak","Liverpool",7],["Mohamed Salah","Liverpool",6],["Harry Kane","Bayern",6]],
assists:[["Bukayo Saka","Arsenal",7],["Mohamed Salah","Liverpool",6],["Bruno Fernandes","Man United",5],["Lamine Yamal","Barcelona",5]]
},
"LaLiga":{
scorers:[["Kylian Mbappe","Real Madrid",12],["Robert Lewandowski","Barcelona",9]],
assists:[["Lamine Yamal","Barcelona",7],["Pedri","Barcelona",5]]
},
"Serie A":{
scorers:[["Gustavo Varela","Monza",9],["Donyell Malen","Roma",8]],
assists:[["Mattia Zaccagni","Lazio",5],["Juan Miranda","Bologna",5]]
},
"Bundesliga":{
scorers:[["Harry Kane","Bayern",10],["Michael Olise","Bayern",6]],
assists:[["Michael Olise","Bayern",4],["Florian Wirtz","Bayern",4]]
},
"Ligue 1":{
scorers:[["Lassine Sinayoko","Paris FC",9],["Amine Gouiri","Marseille",7]],
assists:[["Florian Thauvin","Lens",7],["Cristian Casseress Jr","Toulouse",6]]
}
};

function renderAll(){
var leagues = Object.keys(fallback);
document.getElementById("leagueTabs").innerHTML = leagues.map(function(l){
return '<button class="'+(l===curLeague?'active':'')+'" onclick="curLeague=\''+l+'\';curTopLeague=\''+l+'\';renderAll();">'+l+'</button>';
}).join("");
document.getElementById("topLeaguePills").innerHTML = leagues.map(function(l){
return '<button class="'+(l===curTopLeague?'active':'')+'" onclick="curTopLeague=\''+l+'\';renderAll();">'+l+'</button>';
}).join("");
var s = standings[curLeague] || [];
document.getElementById("standBody").innerHTML = s.map(function(r,i){
return "<tr><td>"+(i+1)+"</td><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td><td>"+r[3]+"</td><td>"+r[4]+"</td><td>"+r[5]+"</td><td>"+r[6]+"</td></tr>";
}).join("");
document.getElementById("topColHead").innerText = curTop==="scorers" ? "Goals" : "Assists";
document.getElementById("btnScorers").className = curTop==="scorers" ? "active" : "";
document.getElementById("btnAssists").className = curTop==="assists" ? "active" : "";
var rows = (fallback[curTopLeague] && fallback[curTopLeague][curTop]) || [];
document.getElementById("topBody").innerHTML = rows.map(function(p,i){
var medal = i===0 ? "🥇 " : "";
return "<tr><td>"+(i+1)+"</td><td>"+medal+p[0]+"</td><td>"+p[1]+"</td><td style='color:#22c55e;font-weight:bold;text-align:right'>"+p[2]+"</td></tr>";
}).join("");
}
function setTop(t){ curTop = t; renderAll(); }
renderAll();
</script>
</body>
</html>
